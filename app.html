<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KINORA — Find your coach</title>
<meta name="description" content="Answer a few questions and we'll match you to a live Kinora coach.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#070a09">
<!-- PWA (installable web app) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kinora">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<!-- Nunito: rounded, friendly display font for headings (BetterMe-style feel) -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!-- Motion (spring-physics animation library) — same as the marketing site -->
<script src="https://cdn.jsdelivr.net/npm/motion@12.40.0/dist/motion.js"></script>
<style>
  :root{
    --bg:#070a09; --bg-2:#0c1310; --panel:#12140f; --panel-2:#0e100c;
    --mint:#6FFFC2; --green:#0E7A5F; --green-soft:#1faa7e;
    --white:#F4F8F6; --gray:#93a39b; --line:rgba(111,255,194,.13); --line-2:rgba(255,255,255,.07);
    --display:'Satoshi',system-ui,sans-serif; --body:'Satoshi',system-ui,sans-serif;
    --rounded:'Nunito','Satoshi',system-ui,sans-serif;   /* rounded headings */
  }
  html[lang="ar"]{ --display:"Segoe UI",Tahoma,system-ui,sans-serif; --body:"Segoe UI",Tahoma,system-ui,sans-serif; --rounded:"Segoe UI",Tahoma,system-ui,sans-serif; }
  html[lang="zh"]{ --display:'Satoshi',"PingFang SC","Microsoft YaHei",system-ui,sans-serif; --body:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; --rounded:'Nunito',"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  html[lang="ko"]{ --display:'Satoshi',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --body:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --rounded:'Nunito',"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--white);font-family:var(--body);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100dvh}
  ::selection{background:var(--mint);color:#04130d}
  button{font-family:inherit}

  /* atmosphere (shared with marketing site) */
  .atmos{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .glow{position:absolute;border-radius:50%;filter:blur(130px)}
  .glow.a{width:560px;height:560px;background:radial-gradient(circle,#0E7A5F,transparent 70%);opacity:.35;top:-180px;left:-120px}
  .glow.b{width:520px;height:520px;background:radial-gradient(circle,#6FFFC2,transparent 70%);opacity:.07;top:52%;right:-180px}
  .grid-tex{position:absolute;inset:0;background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:66px 66px;mask-image:radial-gradient(circle at 50% 0,#000,transparent 72%)}

  /* shell layout */
  .app{min-height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 22px;padding:0 max(22px,env(safe-area-inset-left)) 0 max(22px,env(safe-area-inset-right))}

  /* top bar: back · progress · step / lang */
  .top{display:flex;align-items:center;gap:14px;padding:20px 0 8px;padding-top:max(20px,env(safe-area-inset-top))}
  .iconbtn{width:40px;height:40px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.02);color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;opacity:1}
  .iconbtn:hover{border-color:var(--mint);color:var(--mint)}
  .iconbtn[hidden]{visibility:hidden;pointer-events:none}
  html[dir="rtl"] .iconbtn svg{transform:scaleX(-1)}
  .bar{flex:1;height:6px;border-radius:100px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--green),var(--mint));box-shadow:0 0 12px rgba(111,255,194,.5);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .step{font-size:12.5px;font-weight:600;color:var(--gray);white-space:nowrap;letter-spacing:.04em;font-variant-numeric:tabular-nums}

  /* mini brand row */
  .brand{display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:13px;color:var(--gray);padding:10px 0 2px}
  .brand svg{width:20px;height:20px}

  /* stage */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 8px}
  .q-eyebrow{color:var(--mint);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;margin-bottom:16px}
  .q-title{font-family:var(--display);font-weight:900;font-size:clamp(26px,6.5vw,38px);line-height:1.1;letter-spacing:-.02em;min-height:1.1em}
  .q-title .caret{display:inline-block;width:2px;height:.92em;margin-inline-start:3px;background:var(--mint);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .q-sub{color:var(--gray);font-size:15.5px;margin-top:14px;max-width:460px}

  .options{display:flex;flex-direction:column;gap:12px;margin-top:32px}
  .opt{display:flex;align-items:center;gap:15px;width:100%;text-align:start;background:linear-gradient(165deg,var(--panel),var(--panel-2));border:1px solid var(--line-2);border-radius:16px;padding:17px 18px;cursor:pointer;color:var(--white);transition:border-color .2s,transform .12s,background .2s;position:relative}
  .opt:hover{border-color:var(--line);transform:translateY(-1px)}
  .opt:active{transform:translateY(0) scale(.995)}
  .opt .radio{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;transition:.2s}
  .opt .radio svg{opacity:0;transform:scale(.5);transition:.2s}
  .opt .label{font-family:var(--display);font-weight:700;font-size:16.5px;flex:1}
  .opt .idx{font-size:12px;color:var(--gray);border:1px solid var(--line-2);border-radius:7px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:600}
  .opt.sel{border-color:var(--mint);background:linear-gradient(165deg,rgba(111,255,194,.10),rgba(14,122,95,.05));box-shadow:0 0 0 1px var(--mint),0 18px 40px rgba(111,255,194,.10)}
  .opt.sel .radio{border-color:var(--mint);background:var(--mint)}
  .opt.sel .radio svg{opacity:1;transform:scale(1)}
  .opt.sel .idx{border-color:var(--mint);color:var(--mint)}
  .opt .flag{font-size:20px;flex:0 0 auto}

  /* searchable location step */
  .searchbox{position:relative;margin-top:26px}
  .searchbox svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:15px;color:var(--gray);pointer-events:none}
  .searchbox input{width:100%;background:#070b09;border:1px solid var(--line-2);border-radius:12px;padding:14px 14px 14px 44px;color:var(--white);font-family:var(--body);font-size:15px;transition:border-color .2s}
  html[dir="rtl"] .searchbox input{padding:14px 44px 14px 14px}
  .searchbox input:focus{outline:none;border-color:var(--mint)}
  .searchbox input::placeholder{color:#4c5a53}
  .options.scrolly{max-height:46vh;overflow-y:auto;margin-top:14px;padding-inline-end:4px;scrollbar-width:thin}
  .options.scrolly::-webkit-scrollbar{width:6px}
  .options.scrolly::-webkit-scrollbar-thumb{background:var(--line);border-radius:100px}
  .no-city{color:var(--gray);text-align:center;padding:26px 16px;font-size:14px}

  /* footer note */
  .foot{padding:16px 0 max(22px,env(safe-area-inset-bottom));text-align:center;color:var(--gray);font-size:12px}
  .foot .lockrow{display:inline-flex;align-items:center;gap:6px;opacity:.7}

  /* lang menu (compact, reused idea) */
  .lang{position:relative}
  .lang-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.02);border:1px solid var(--line-2);color:var(--white);padding:8px 11px;border-radius:11px;font-family:var(--body);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;height:40px}
  .lang-btn:hover{border-color:var(--mint)} .lang-btn .chev{font-size:9px;color:var(--gray)}
  .lang-menu{position:absolute;top:48px;inset-inline-end:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s;z-index:60}
  .lang-menu.open{opacity:1;visibility:visible;transform:translateY(0)}
  .lang-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:.15s}
  .lang-item:hover{background:rgba(111,255,194,.08)} .lang-item.active{background:rgba(111,255,194,.12);color:var(--mint)}
  .lang-item .flag{font-size:16px}

  /* completion (temporary Phase-1 end screen) */
  .done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
  .done .ic{width:74px;height:74px;border-radius:50%;background:rgba(111,255,194,.12);display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .done h2{font-family:var(--display);font-weight:900;font-size:clamp(24px,5.5vw,32px);letter-spacing:-.02em;line-height:1.12}
  .done p{color:var(--gray);font-size:15.5px;max-width:420px}
  .btn{font-family:var(--display);font-weight:700;font-size:15px;border:none;cursor:pointer;border-radius:12px;transition:transform .15s,box-shadow .25s;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;margin-top:24px}
  .btn-primary{background:var(--mint);color:#04130d}
  .btn-primary:hover{box-shadow:0 14px 34px rgba(111,255,194,.3)}
  .btn-ghost{background:transparent;color:var(--white);border:1px solid var(--line-2)}
  .btn-ghost:hover{border-color:var(--mint);color:var(--mint)}

  /* ============================================================
     QUIZ REDESIGN — BetterMe-style UX, Kinora mint kept.
     (Appended after base rules so these overrides win.)
     ============================================================ */
  .atmos .glow.a{opacity:.14} .atmos .glow.b{opacity:.05}
  .brand{display:none}
  /* top bar */
  .top{padding:16px 0 8px;padding-top:max(16px,env(safe-area-inset-top));gap:12px}
  .section-name{flex:1;text-align:center;font-family:var(--rounded);font-weight:800;font-size:15px;color:var(--white);letter-spacing:.01em;min-width:0}
  /* segmented progress */
  .segs{display:flex;gap:6px;margin:2px 0 4px}
  .seg{flex:1;height:4px;border-radius:100px;background:rgba(255,255,255,.09);overflow:hidden}
  .seg > span{display:block;height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--green),var(--mint));box-shadow:0 0 10px rgba(111,255,194,.5);transition:width .5s cubic-bezier(.2,.8,.2,1)}

  /* stage top-aligned */
  .stage{justify-content:flex-start;padding-top:22px}
  /* heading: rounded + centered */
  .q-title{font-family:var(--rounded);font-weight:900;font-size:clamp(26px,5.8vw,37px);text-align:center;letter-spacing:-.01em;line-height:1.16;min-height:auto}
  .q-title .caret{height:.86em}
  .q-sub{text-align:center;margin-inline:auto;font-size:15px}

  /* option cards */
  .options{max-width:520px;margin-inline:auto;width:100%;margin-top:28px;gap:13px}
  .options.scrolly{max-height:46vh}
  .opt{border-radius:16px;padding:18px;gap:14px;background:#14170f;border:1px solid rgba(255,255,255,.05);transition:background .18s,border-color .18s,transform .1s}
  .opt:hover{border-color:rgba(255,255,255,.12);transform:none}
  .opt .label{font-family:var(--rounded);font-weight:700;font-size:16px}
  .opt .idx{display:none}
  .opt .radio{order:3;margin-inline-start:auto}
  .opt.multi .radio{border-radius:7px}
  /* selected = mint fill + dark check (kept mint, not BetterMe cream) */
  .opt.sel{background:var(--mint);border-color:var(--mint);box-shadow:none}
  .opt.sel .label{color:#04130d}
  .opt.sel .flag{filter:none}
  .opt.sel .radio{border-color:#04130d;background:#04130d}
  .opt.sel .radio svg path{stroke:var(--mint)}

  /* bottom CTA (mint pill) — for multi / number / search / interstitial */
  .cta-bar{position:sticky;bottom:0;max-width:520px;margin-inline:auto;width:100%;padding:14px 0 max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 34%);z-index:5}
  .cta{width:100%;font-family:var(--rounded);font-weight:800;font-size:16px;border:none;border-radius:100px;padding:16px;background:var(--mint);color:#04130d;cursor:pointer;transition:box-shadow .25s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .cta:hover{box-shadow:0 14px 34px rgba(111,255,194,.3)}
  .cta[disabled]{opacity:.32;pointer-events:none}
  .cta-skip{display:block;margin:12px auto 0;background:none;border:none;color:var(--gray);font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.04em;cursor:pointer;text-transform:uppercase}

  /* number step */
  .numstep{max-width:440px;margin-inline:auto;width:100%;background:linear-gradient(165deg,var(--panel),var(--panel-2));border:1px solid var(--line-2);border-radius:22px;padding:28px 24px;margin-top:22px}
  .unit-toggle{display:flex;background:rgba(255,255,255,.05);border-radius:100px;padding:4px;width:max-content;margin:0 auto 22px}
  .unit-toggle button{border:none;background:none;color:var(--gray);font-family:var(--rounded);font-weight:800;padding:7px 20px;border-radius:100px;cursor:pointer;font-size:13.5px}
  .unit-toggle button.on{background:var(--mint);color:#04130d}
  .numrow{display:flex;align-items:baseline;justify-content:center;gap:12px;border-bottom:2px solid var(--line-2);padding-bottom:10px}
  .numrow input{font-family:var(--rounded);font-weight:900;font-size:54px;background:none;border:none;color:var(--white);text-align:end;width:2.6ch;outline:none;padding:0}
  .numrow .unit{font-family:var(--rounded);font-weight:800;font-size:26px;color:var(--gray)}
  .infocard{display:flex;gap:11px;align-items:flex-start;background:rgba(111,255,194,.06);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:20px;font-size:13.5px;color:var(--gray)}
  .infocard svg{flex:0 0 auto;color:var(--mint);margin-top:1px}

  /* interstitial (social proof / trust) */
  .inter{max-width:540px;margin-inline:auto;width:100%;text-align:center;padding-top:8px}
  .inter h1{font-family:var(--rounded);font-weight:900;font-size:clamp(26px,6vw,38px);line-height:1.12;letter-spacing:-.01em}
  .inter .stat{margin:30px 0 6px}
  .inter .stat .big{font-family:var(--rounded);font-weight:900;font-size:clamp(52px,15vw,84px);color:var(--mint);line-height:1}
  .inter .stat .sub{color:var(--gray);font-size:15px;margin-top:4px}
  .review{background:linear-gradient(165deg,var(--panel),var(--panel-2));border:1px solid var(--line-2);border-radius:18px;padding:20px;text-align:start;max-width:470px;margin:24px auto 0}
  .review .stars{color:var(--mint);letter-spacing:3px;font-size:15px}
  .review .rtext{margin:10px 0 8px;font-size:15px;line-height:1.55}
  .review .rname{color:var(--gray);font-size:13px;font-weight:700}
  .inter .why{margin-top:26px}
  .inter .why-item{text-align:start}

  /* analyzing loader */
  .analyzing{max-width:520px;margin-inline:auto;width:100%;padding-top:12px}
  .analyzing h1{font-family:var(--rounded);font-weight:900;font-size:clamp(25px,5.6vw,34px);text-align:center;margin-bottom:32px}
  .an-row{margin-bottom:22px}
  .an-row .l{display:flex;justify-content:space-between;align-items:center;font-family:var(--rounded);font-weight:800;margin-bottom:9px;font-size:15px}
  .an-row .l .pct{color:var(--gray);font-variant-numeric:tabular-nums}
  .an-bar{height:7px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden}
  .an-bar > span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:100px;transition:width .5s ease}
  .an-check{color:var(--mint)}

  /* ===== Phase 2: personalized results / coach match ===== */
  .stage.scroll{justify-content:flex-start;padding-top:12px}
  .results{display:flex;flex-direction:column;gap:26px;padding-bottom:8px}
  .r-head h1{font-family:var(--rounded);font-weight:900;font-size:clamp(26px,6.5vw,38px);line-height:1.12;letter-spacing:-.02em;margin-top:12px;text-align:center}
  .r-head .q-eyebrow{text-align:center}
  /* profile card (BetterMe "wellness profile" style) */
  .profile-card{background:linear-gradient(165deg,var(--panel),var(--panel-2));border:1px solid var(--line-2);border-radius:20px;padding:22px}
  .meter{margin:4px 0 2px;padding-top:24px}
  .meter-scale{position:relative;height:12px;border-radius:100px;background:linear-gradient(90deg,#8affd4,#6FFFC2,#1faa7e,#0E7A5F)}
  html[dir="rtl"] .meter-scale{background:linear-gradient(270deg,#8affd4,#6FFFC2,#1faa7e,#0E7A5F)}
  .meter-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--mint);box-shadow:0 0 0 3px var(--bg)}
  html[dir="rtl"] .meter-mark{transform:translate(50%,-50%)}
  .meter-bub{position:absolute;bottom:24px;inset-inline-start:50%;transform:translateX(-50%);white-space:nowrap;background:var(--mint);color:#04130d;font-family:var(--rounded);font-weight:800;font-size:12.5px;padding:4px 12px;border-radius:100px}
  html[dir="rtl"] .meter-bub{transform:translateX(50%)}
  .meter-ticks{display:flex;justify-content:space-between;margin-top:13px;color:var(--gray);font-size:11.5px;font-weight:700;font-family:var(--rounded)}
  .callout{display:flex;gap:11px;align-items:flex-start;background:rgba(111,255,194,.08);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:20px 0 4px}
  .callout svg{color:var(--mint);flex:0 0 auto;margin-top:1px}
  .callout b{font-family:var(--rounded);font-weight:800;font-size:14px;display:block;margin-bottom:3px}
  .callout span{color:var(--gray);font-size:13.5px;line-height:1.5}
  .traits{display:grid;grid-template-columns:1fr 1fr;gap:15px 16px;margin-top:22px}
  .trait{display:flex;gap:11px;align-items:center;min-width:0}
  .trait .ti{width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);background:rgba(111,255,194,.05);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--mint)}
  .trait .tl{color:var(--gray);font-size:11.5px}
  .trait .tv{font-family:var(--rounded);font-weight:800;font-size:14px;margin-top:1px;word-break:break-word}
  @media(max-width:520px){.traits{grid-template-columns:1fr}}
  .pcard-name{font-family:var(--rounded)}
  .r-head p{color:var(--gray);font-size:15.5px;margin-top:12px;max-width:480px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--white);background:rgba(111,255,194,.06);border:1px solid var(--line);padding:7px 12px;border-radius:100px}
  .chip .cd{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);flex:0 0 auto}
  .section-label{color:var(--mint);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;margin-bottom:13px}

  .pcard{background:linear-gradient(165deg,var(--panel),var(--panel-2));border:1px solid var(--mint);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(111,255,194,.22),0 30px 70px rgba(0,0,0,.5)}
  .pcard-top{padding:22px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line-2)}
  .pcard-av{width:66px;height:66px;border-radius:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:23px;color:#04130d}
  .pcard-name{font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:-.01em;line-height:1.15}
  .pcard-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mint);background:rgba(111,255,194,.1);padding:3px 9px;border-radius:100px;margin-top:7px}
  .pmeta{display:flex;flex-direction:column;gap:13px;padding:20px 22px}
  .pmeta-row{display:flex;gap:12px;font-size:14px;align-items:center}
  .pmeta-row .ml{color:var(--gray);min-width:104px;flex:0 0 auto}
  .pmeta-row .mv{font-weight:600}

  /* ===== Phase 3 redesign: countdown checkout (BetterMe-style) ===== */

  /* ===== Phase 4: auth shell ===== */
  .auth{max-width:440px;width:100%;margin:0 auto;display:flex;flex-direction:column}

  .auth-head h1{font-family:var(--display);font-weight:900;font-size:clamp(24px,6vw,32px);letter-spacing:-.02em;line-height:1.12;margin-top:10px}

  .slot,.date-input{font-family:var(--rounded)}

/* ============================================================
   Multi-currency (Stripe presentment currencies). Base = AED.
   `rate` = AED × rate → currency amount. `round` = pretty rounding.
   Rates are placeholders — a live build fetches FX (or uses Stripe's
   own presentment-currency conversion) — but the UI is fully wired.
   ============================================================ */
const CURRENCIES = {
  AED:{sym:"AED",rate:1,     round:1,   name:"UAE Dirham",     flag:"🇦🇪", pre:true},
  USD:{sym:"$",  rate:0.272, round:1,   name:"US Dollar",      flag:"🇺🇸", pre:true},
  EUR:{sym:"€",  rate:0.25,  round:1,   name:"Euro",           flag:"🇪🇺", pre:true},
  GBP:{sym:"£",  rate:0.214, round:1,   name:"British Pound",  flag:"🇬🇧", pre:true},
  KRW:{sym:"₩",  rate:377,   round:100, name:"Korean Won",     flag:"🇰🇷", pre:true},
  SAR:{sym:"SAR",rate:1.02,  round:1,   name:"Saudi Riyal",    flag:"🇸🇦", pre:true},
  JPY:{sym:"¥",  rate:42,    round:10,  name:"Japanese Yen",   flag:"🇯🇵", pre:true},
  INR:{sym:"₹",  rate:22.8,  round:1,   name:"Indian Rupee",   flag:"🇮🇳", pre:true},
  CNY:{sym:"¥",  rate:1.97,  round:1,   name:"Chinese Yuan",   flag:"🇨🇳", pre:true},
  CAD:{sym:"C$", rate:0.378, round:1,   name:"Canadian Dollar",flag:"🇨🇦", pre:true}
};
const CUR_LABEL = {en:"Prices in",ar:"الأسعار بـ",zh:"价格货币",ru:"Цены в",ko:"표시 통화"};
function fmtIn(aed, code){
  const c = CURRENCIES[code] || CURRENCIES.AED;
  let v = aed * c.rate;
  v = c.round > 1 ? Math.round(v / c.round) * c.round : Math.round(v);
  const s = v.toLocaleString("en-US");
  return c.pre ? `${c.sym} ${s}` : `${s} ${c.sym}`;
}
function fmtPrice(aed){ return fmtIn(aed, kinora.currency); }

// respect reduced-motion; `?static` forces the settled state (no entrance
// animation / typewriter) — useful for static-snapshot preview environments
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  || location.search.includes("static");
const M = window.Motion;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const stage = $("#stage"), barFill = $("#barFill"), stepLabel = $("#stepLabel"),
      backBtn = $("#backBtn"), footNote = $("#footNote"), footText = $("#footText");

function L(dict){ return (dict && (dict[kinora.lang] ?? dict.en)) || ""; }

/* ---------- language switcher ---------- */
const langBtn = $("#langBtn"), langMenu = $("#langMenu");
langBtn.addEventListener("click", e => { e.stopPropagation(); langMenu.classList.toggle("open"); });
document.addEventListener("click", () => langMenu.classList.remove("open"));
document.querySelectorAll(".lang-item").forEach(it =>
  it.addEventListener("click", () => { setLang(it.dataset.lang); langMenu.classList.remove("open"); }));

function setLang(lang){
  kinora.lang = lang;
  const cfg = UI[lang];
  const h = document.documentElement;
  h.setAttribute("lang", lang); h.setAttribute("dir", cfg.dir);
  $("#langFlag").textContent = cfg.flag; $("#langLabel").textContent = cfg.label;
  document.querySelectorAll(".lang-item").forEach(it => it.classList.toggle("active", it.dataset.lang === lang));
  footText.textContent = cfg.foot;
  render(true);  // re-render current screen in the new language (skip typewriter)
}

/* ---------- chrome (segmented progress + section name + back) ---------- */
const segsEl = $("#segs"), sectionNameEl = $("#sectionName");
function updateChrome(){
  if (kinora.view !== "quiz"){          // results / paywall / auth / dashboard
    segsEl.style.display = "none";
    sectionNameEl.textContent = "";
    backBtn.hidden = false;
    footNote.style.visibility = "hidden";
    return;
  }
  segsEl.style.display = "flex";
  const step = STEPS[Math.min(kinora.step, STEPS.length - 1)];
  const curSecIdx = SECTIONS.findIndex(s => s.id === step.section);
  sectionNameEl.textContent = L(SECTIONS[curSecIdx].name);
  // segment fill = questions reached / questions total, per section
  segsEl.innerHTML = SECTIONS.map((s, i) => {
    let pct = 0;
    if (i < curSecIdx) pct = 100;
    else if (i === curSecIdx){
      const total = QUESTIONS.filter(q => q.section === s.id).length;
      const reached = STEPS.filter((st, idx) => st.id && st.section === s.id && idx <= kinora.step).length;
      pct = total ? Math.min(100, Math.round(reached / total * 100)) : 100;
    }
    return `<div class="seg"><span style="width:${pct}%"></span></div>`;
  }).join("");
  backBtn.hidden = kinora.step === 0;
  footNote.style.visibility = kinora.step <= 1 ? "visible" : "hidden";
}

/* ---------- typewriter ---------- */
let twTimer = null;
function typewriter(el, text, instant){
  clearInterval(twTimer);
  if (instant || reduced){ el.textContent = text; return; }
  el.textContent = "";
  const caret = document.createElement("span");
  caret.className = "caret"; el.appendChild(caret);
  let i = 0;
  twTimer = setInterval(() => {
    if (i >= text.length){ clearInterval(twTimer); caret.remove(); return; }
    caret.insertAdjacentText("beforebegin", text[i++]);
  }, 20);
}

/* ---------- transitions ---------- */
function animateIn(node){
  if (reduced || !M) return;
  const items = [node.querySelector(".q-head"), ...node.querySelectorAll(".opt")].filter(Boolean);
  items.forEach((el, i) => {
    M.animate(el, { opacity:[0,1], y:[16,0] },
      { type:"spring", stiffness:110, damping:16, delay: 0.05 + Math.min(i, 9) * 0.045 });
  });
}

/* ---------- render (view router) ---------- */
function render(instant){
  updateChrome();
  const appEl = document.querySelector(".app");
  appEl.classList.toggle("wide", kinora.view === "paywall");
  appEl.classList.toggle("auth-wide", kinora.view === "auth");
  appEl.classList.toggle("dash-mode", kinora.view === "dashboard");
  if (kinora.view !== "paywall" && countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  if (kinora.view === "results"){ stage.classList.add("scroll"); renderResults(); return; }
  if (kinora.view === "paywall"){ stage.classList.add("scroll"); renderPaywall(); return; }
  if (kinora.view === "auth"){ stage.classList.add("scroll"); renderAuth(); return; }
  if (kinora.view === "dashboard"){ stage.classList.add("scroll"); renderDashboard(); return; }
  stage.classList.remove("scroll");
  renderQuizStep(instant);
}

/* dispatch the current quiz step by type */
function renderQuizStep(instant){
  const step = STEPS[kinora.step];
  if (step.type === "inter"){ renderInterstitial(step, instant); return; }
  if (step.type === "loader"){ renderLoader(); return; }
  if (step.type === "number"){ renderNumber(step, instant); return; }
  renderQuestion(step, instant);           // single | multi | search
}

/* single / multi / search question with option cards */
function renderQuestion(step, instant){
  const isMulti = step.type === "multi", isSearch = step.type === "search";
  if (isSearch) stage.classList.add("scroll"); else stage.classList.remove("scroll");
  const cur = kinora.quiz[step.id];
  const isSel = v => isMulti ? (Array.isArray(cur) && cur.includes(v)) : cur === v;

  const optHTML = opt => `
    <button class="opt${isMulti ? " multi" : ""}${isSel(opt.val) ? " sel" : ""}" data-val="${opt.val}">
      ${opt.flag ? `<span class="flag">${opt.flag}</span>` : ""}
      <span class="label">${L(opt.l)}</span>
      <span class="radio"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke="#04130d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>`;

  const searchBox = isSearch ? `
    <div class="searchbox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="citySearch" type="text" placeholder="${UI[kinora.lang].loc_search}" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>` : "";

  const subline = isMulti ? UI[kinora.lang].choose : (step.s ? L(step.s) : "");
  const hasMulti = isMulti && Array.isArray(cur) && cur.length > 0;
  const cta = isMulti
    ? `<div class="cta-bar"><button class="cta" id="ctaNext" ${hasMulti ? "" : "disabled"}>${UI[kinora.lang].next} →</button></div>`
    : "";

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="q-head">
      <h1 class="q-title" id="qTitle"></h1>
      ${subline ? `<p class="q-sub">${subline}</p>` : ""}
    </div>
    ${searchBox}
    <div class="options${isSearch ? " scrolly" : ""}" id="options">${step.o.map(optHTML).join("")}</div>
    ${cta}`;

  stage.replaceChildren(wrap);
  typewriter($("#qTitle"), L(step.t), instant);
  animateIn(wrap);

  const optsBox = wrap.querySelector("#options");
  const bindOpts = () => optsBox.querySelectorAll(".opt").forEach(btn =>
    btn.addEventListener("click", () => {
      if (isMulti) toggleMulti(step, btn.dataset.val, btn, wrap);
      else choose(step.id, btn.dataset.val, btn);   // single & search auto-advance
    }));
  bindOpts();

  if (cta) wrap.querySelector("#ctaNext").addEventListener("click", next);

  if (isSearch){
    const input = wrap.querySelector("#citySearch");
    input.addEventListener("input", () => {
      const query = input.value.trim().toLowerCase();
      const matches = step.o.filter(o => !query || L(o.l).toLowerCase().includes(query) || (o.k || "").includes(query));
      optsBox.innerHTML = matches.length ? matches.map(optHTML).join("") : `<div class="no-city">${UI[kinora.lang].loc_none}</div>`;
      bindOpts();
    });
    if (!reduced) setTimeout(() => input.focus(), 60);
  }
}

  stage.classList.remove("scroll");
  const val = kinora.quiz[step.id] || (step.id === "age" ? 28 : step.min || 0);
  const wrap = document.createElement("div");
  wrap.innerHTML = `

    <div class="cta-bar"><button class="cta" id="ctaNext">${UI[kinora.lang].cont} →</button></div>`;
  stage.replaceChildren(wrap);
  typewriter($("#qTitle"), L(step.t), instant);
  animateIn(wrap);
  const input = wrap.querySelector("#numInput");
  kinora.quiz[step.id] = String(val);
  input.addEventListener("input", () => { kinora.quiz[step.id] = input.value; });
  wrap.querySelector("#ctaNext").addEventListener("click", () => {
    let v = parseInt(input.value, 10);
    if (isNaN(v)) v = step.min;
    v = Math.max(step.min, Math.min(step.max, v));
    kinora.quiz[step.id] = String(v);
    next();
  });
}

/* "Analyzing your answers…" loader, then -> results */
function renderLoader(){
  if (reduced){ kinora.view = "results"; render(); return; }
  stage.classList.remove("scroll");
  const rows = SECTIONS.map((s, i) => `
    <div class="an-row"><div class="l"><span>${L(s.name)}</span><span class="pct" id="pct${i}">0%</span></div>
      <div class="an-bar"><span id="anb${i}"></span></div></div>`).join("");
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="analyzing"><h1>${UI[kinora.lang].analyzing}</h1>${rows}</div>`;
  stage.replaceChildren(wrap);
  const per = 620;
  SECTIONS.forEach((s, i) => {
    setTimeout(() => {
      const b = document.getElementById("anb" + i), p = document.getElementById("pct" + i);
      if (b) b.style.width = "100%";
      if (p) p.innerHTML = `<span class="an-check">✓</span>`;
    }, 200 + i * per);
  });
  setTimeout(() => { kinora.view = "results"; render(); }, 200 + SECTIONS.length * per + 500);
}

function choose(id, val, btn){
  kinora.quiz[id] = val;
  btn.parentElement.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
  btn.classList.add("sel");
  // choosing the coaching *language* is a preference — does NOT switch the UI language
  setTimeout(next, reduced ? 0 : 300);
}

function toggleMulti(step, val, btn, wrap){
  let arr = Array.isArray(kinora.quiz[step.id]) ? kinora.quiz[step.id].slice() : [];
  arr = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
  kinora.quiz[step.id] = arr;
  btn.classList.toggle("sel", arr.includes(val));
  const cta = wrap.querySelector("#ctaNext");
  if (cta) cta.disabled = arr.length === 0;
}

function next(){
  kinora.step++;
  if (kinora.step >= STEPS.length){ kinora.view = "results"; }   // safety fallback
  render();
}
function back(){
  if (kinora.view === "dashboard"){                 // within the app: step back through booking
    if (kinora.tab === "book" && kinora.book.step > 0 && kinora.book.step < 3){ kinora.book.step--; render(); }
    else if (kinora.tab !== "home"){ kinora.tab = "home"; render(); }
    return;
  }
  if (kinora.view === "auth"){ kinora.view = "paywall"; render(); return; }
  if (kinora.view === "paywall"){ kinora.view = "results"; render(); return; }
  if (kinora.view === "results"){        // back to the last real question (not the loader)
    const lastQ = STEPS.map((s, i) => s.id ? i : -1).filter(i => i >= 0).pop();
    kinora.view = "quiz"; kinora.step = lastQ; render(); return;
  }
  if (kinora.step > 0){ kinora.step--; render(); }
}
backBtn.addEventListener("click", back);

/* keyboard: Backspace goes back; 1-9 select (quiz only) */
document.addEventListener("keydown", e => {
  const el = document.activeElement;
  if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;  // typing, not navigating
  if (e.key === "Backspace"){ e.preventDefault(); back(); return; }
  if (kinora.view !== "quiz") return;
  const n = parseInt(e.key, 10);
  if (!isNaN(n)){
    const opts = stage.querySelectorAll(".opt");
    if (n >= 1 && n <= opts.length) opts[n - 1].click();
  }
});

function answerLabel(qid, val){
  const q = QUESTIONS.find(x => x.id === qid);
  if (!q) return val;
  const o = q.o.find(x => x.val === val);
  return o ? L(o.l) : val;
}

  stage.replaceChildren(wrap);
  startCountdown();
  if (!reduced && M){
    wrap.querySelectorAll("[data-a]").forEach((el, i) =>
      M.animate(el, { opacity:[0,1], y:[18,0] }, { type:"spring", stiffness:110, damping:17, delay: 0.04 + i * 0.06 }));
  }

  // select a plan (radio) — re-render to reflect selection
  wrap.querySelectorAll("[data-plan]").forEach(btn =>
    btn.addEventListener("click", () => { kinora.plan = btn.dataset.plan; render(); }));
  // select a Stripe payment method (Card / Apple Pay / Google Pay / Link)
  wrap.querySelectorAll("[data-pm]").forEach(btn =>
    btn.addEventListener("click", () => { kinora.payMethod = btn.dataset.pm; render(); }));
  // change display currency (top-10 Stripe presentment currencies)
  wrap.querySelectorAll("[data-cur]").forEach(btn =>
    btn.addEventListener("click", () => { kinora.currency = btn.dataset.cur; render(); }));
  // GET MY PLAN (top + bottom) -> signup
  // TODO: connect Stripe — create a Checkout Session / Payment Element with the
  // selected plan (kinora.plan) + method (kinora.payMethod: card|apple|google|link)
  const go = () => { console.log("[Kinora] Plan:", kinora.plan, "· method:", kinora.payMethod); kinora.view = "auth"; kinora.authMode = "signup"; render(); };
  wrap.querySelector("#getTop").addEventListener("click", go);
  wrap.querySelector("#getBottom").addEventListener("click", go);
}

function submitAuth(wrap, isSignup){
  const a = AUTH[kinora.lang];
  let ok = true;
  const val = n => { const el = wrap.querySelector(`[name="${n}"]`); return el ? el.value.trim() : ""; };
  const setErr = (name, msg) => {
    const f = wrap.querySelector(`[data-field="${name}"]`); if (!f) return;
    f.classList.toggle("err", !!msg);
    if (msg){ f.querySelector(".msg").textContent = msg; ok = false; }
  };
  if (isSignup) setErr("name", val("name").length >= 2 ? "" : a.err_name);
  setErr("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("email")) ? "" : a.err_email);
  if (isSignup) setErr("whatsapp", /^\+?[0-9][0-9\s-]{6,}$/.test(val("whatsapp")) ? "" : a.err_whatsapp);
  setErr("password", val("password").length >= 6 ? "" : a.err_password);
  if (!ok) return;

  /* =====================================================================
     TODO: connect Supabase auth  (drop-in — the UI above needs no redesign)
     Replace this mock with a real call, e.g.:
       const { data, error } = await supabase.auth.signUp({
         email: val("email"), password: val("password"),
         options: { data: { full_name: val("name"), whatsapp: val("whatsapp") } }
       });
     — or supabase.auth.signInWithPassword({ email, password }) for login.
     (Firebase createUserWithEmailAndPassword / signInWithEmailAndPassword work the same.)
     ===================================================================== */
  kinora.auth = { name:val("name"), email:val("email"), whatsapp:val("whatsapp"), mode:isSignup ? "signup" : "login" };
  console.log("[Kinora] (mock) auth payload:", JSON.stringify(kinora.auth, null, 2));
  authSuccess();
}

  const a = AUTH[kinora.lang];
  const wrap = document.createElement("div");

/* ============================================================
   Phase 5: client dashboard shell
   ============================================================ */
function fmtDate(str){
  try { return new Date(str + "T00:00:00").toLocaleDateString(LOCALES[kinora.lang] || "en-US",
    { weekday:"short", month:"short", day:"numeric" }); }
  catch(e){ return str; }
}
function isoOffset(days){ const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); }
function coachName(id){ const p = PERSONAS[id]; return p ? L(p.n) : id; }

// demo sessions used by the mock-data toggle
function demoSessions(){
  return [
    { id:"demo1", coach:"build_muscle", date:isoOffset(2), time:"09:00" },
    { id:"demo2", coach:"mobility",     date:isoOffset(5), time:"19:00" }
  ];
}
function upcomingSessions(){
  // demo data + any sessions the user booked this session, soonest first
  const base = kinora.demo ? demoSessions() : [];
  return [...base, ...kinora.sessions].sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
}

/* ----- Home tab: progress + upcoming sessions + demo toggle ----- */
function dashHome(body){
  const d = DASH[kinora.lang];

  const stats = `
    <div class="stats" data-a>

      <div class="stat"><div class="sn">${sessions.length}</div><div class="sl">${d.st_upcoming}</div></div>

  body.innerHTML = `

  if (eb) eb.addEventListener("click", () => { kinora.tab = "book"; kinora.book.step = 0; render(); });
  // "Join" is a live-session placeholder in the shell
  body.querySelectorAll(".btn-join").forEach(b =>
    b.addEventListener("click", () => alert("// TODO: launch the live video session (e.g. Daily / Twilio / Agora room).")));
}

/* ----- Book tab: date/time -> coach -> confirm ----- */
function dashBook(body){
  const d = DASH[kinora.lang], b = kinora.book;
  const dots = [0,1,2].map(i => `<div class="book-dot${b.step >= i ? " on" : ""}"></div>`).join("");

  if (b.step === 3){  // booked success
    body.innerHTML = `
      <div class="empty" data-a style="border-style:solid;border-color:var(--mint);background:rgba(111,255,194,.05)">
        <div class="ei"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke="#6FFFC2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h3>${d.booked_title}</h3><p>${d.booked_sub}</p>
        <button class="btn btn-primary" id="viewSess">${d.view_sessions} →</button></div>`;
    body.querySelector("#viewSess").addEventListener("click", () => { kinora.tab = "home"; render(); });
    return;
  }

  let inner = "";
  if (b.step === 0){
    inner = `
      <div class="book-h">${d.s_when}</div>
      <div class="field" style="margin-bottom:20px"><label>${d.date}</label>
        <input type="date" class="date-input" id="bookDate" min="${isoOffset(0)}" value="${b.date}"></div>
      <label style="display:block;font-size:13px;color:var(--gray);margin-bottom:9px;font-weight:600">${d.time}</label>
      <div class="slots">${TIME_SLOTS.map(t => `<button class="slot${b.time === t ? " on" : ""}" data-slot="${t}">${t}</button>`).join("")}</div>
      <div class="book-actions"><button class="btn btn-primary" id="bookNext" ${b.date && b.time ? "" : "disabled"}>${d.cont} →</button></div>`;
  } else if (b.step === 1){
    inner = `
      <div class="book-h">${d.s_coach}</div>
      <div class="coachpick">${Object.keys(PERSONAS).map(id => { const p = PERSONAS[id];
        return `<button class="cpick${b.coach === id ? " on" : ""}" data-coach="${id}">
          <span class="cav" style="background:${p.grad}">${p.initials}</span>
          <span><span class="cn">${L(p.n)}</span><span class="cs" style="display:block">${d.sess_type}</span></span></button>`; }).join("")}</div>
      <div class="book-actions"><button class="btn btn-primary" id="bookNext" ${b.coach ? "" : "disabled"}>${d.cont} →</button></div>`;
  } else {
    const p = PERSONAS[b.coach];
    inner = `
      <div class="book-h">${d.s_confirm}</div>
      <div class="confirm">
        <div class="crow"><span class="cl">${d.coach}</span><span class="cv">${coachName(b.coach)}</span></div>
        <div class="crow"><span class="cl">${d.date}</span><span class="cv">${fmtDate(b.date)}</span></div>
        <div class="crow"><span class="cl">${d.time}</span><span class="cv">${b.time}</span></div>
        <div class="crow"><span class="cl">${DASH[kinora.lang].nav_book}</span><span class="cv">${d.sess_type}</span></div>
      </div>
      <div class="book-actions"><button class="btn btn-primary" id="bookConfirm">${d.confirm}</button></div>`;
  }

  body.innerHTML = `<div class="book-steps" data-a>${dots}</div><div data-a>${inner}</div>`;

  const dateEl = body.querySelector("#bookDate");
  if (dateEl) dateEl.addEventListener("change", e => { kinora.book.date = e.target.value; render(); });
  body.querySelectorAll("[data-slot]").forEach(s =>
    s.addEventListener("click", () => { kinora.book.time = s.dataset.slot; render(); }));
  body.querySelectorAll("[data-coach]").forEach(c =>
    c.addEventListener("click", () => { kinora.book.coach = c.dataset.coach; render(); }));
  const next = body.querySelector("#bookNext");
  if (next) next.addEventListener("click", () => { kinora.book.step++; render(); });
  const conf = body.querySelector("#bookConfirm");
  if (conf) conf.addEventListener("click", () => {
    // ---- add the booked session to in-memory state (POST-ready) ----
    // TODO: connect Stripe — charge the session / decrement plan credits here
    kinora.sessions.push({ id:"s" + Date.now(), coach:kinora.book.coach, date:kinora.book.date, time:kinora.book.time });
    console.log("[Kinora] Session booked:", JSON.stringify(kinora.sessions.at(-1), null, 2));
    kinora.book = { step:3, date:"", time:"", coach:"" };
    render();
  });
}
